<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inbox • EchoMateLite</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
min-height:100vh;
padding-bottom:100px;
}

.page{
max-width:750px;
margin:40px auto;
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo a{
text-decoration:none;
color:white;
}

.logo h1{
font-weight:800;
}

.chat-card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border-radius:22px;
padding:20px;
margin-bottom:18px;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

.chat-card h5{
margin:0;
font-weight:600;
}

</style>

</head>

<body>

<div class="page">

<div class="logo">

<a href="/dashboard">

<h1>🚀 EchoMateLite</h1>

</a>

<h4 class="text-white">

Inbox

</h4>

</div>

{% if chats %}

{% for chat in chats %}

<div class="chat-card">

<div>

<h5>

👤 {{ chat[1] }}

</h5>

</div>

<a
href="/chat/{{ chat[0] }}"
class="btn btn-light rounded-pill">

Open Chat →

</a>

</div>

{% endfor %}

{% else %}

<div class="alert alert-light">

No chats yet.

</div>

{% endif %}

<div class="text-center mt-4">

</div>

</div>

{% include "navbar.html" %}

</body>
</html>
