<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login • EchoMateLite</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
/* --- BASE BACKGROUND --- */
body {
    background: linear-gradient(135deg, #0f172a 0%, #000000 100%);
    color: #ffffff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
    overflow-x: hidden;
}

/* --- ANIMATIONS --- */
@keyframes slideDownFade {
    0% { opacity: 0; transform: translateY(-30px); }
    100% { opacity: 1; transform: translateY(0); }
}

@keyframes slideUpFade {
    0% { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
}

/* --- BRANDING HEADER (Centered above card) --- */
.brand-container {
    text-align: center;
    margin-bottom: 25px;
    animation: slideDownFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Gradient Rocket Icon */
.brand-icon {
    font-size: 42px;
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
    margin-bottom: -5px;
}

/* Gradient Text matching your screenshot */
.brand-title {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(90deg, #6366f1 0%, #a855f7 50%, #f97316 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
    letter-spacing: -0.5px;
}

.brand-subtitle {
    color: #94a3b8;
    font-weight: 500;
    font-size: 14px;
    margin-top: 5px;
    letter-spacing: 0.5px;
}

/* --- WHITE FORM CARD --- */
.auth-card {
    background: #ffffff;
    color: #000000;
    border-radius: 36px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.auth-header {
    font-weight: 800;
    font-size: 24px;
    text-align: center;
    margin-bottom: 25px;
    color: #000;
}

/* --- FORM INPUTS --- */
.form-label {
    font-weight: 700;
    font-size: 13px;
    color: #111827;
    margin-left: 5px;
    margin-bottom: 8px;
}

.form-control {
    background: #F4F4F5;
    border: none;
    border-radius: 20px;
    padding: 16px 20px;
    font-size: 15px;
    font-weight: 500;
    color: #000;
    transition: 0.3s;
}

.form-control:focus {
    background: #eef0f2;
    box-shadow: inset 0 0 0 2px #d1d5db;
    outline: none;
}

/* --- BUTTON & LINKS --- */
.btn-custom {
    background: #000000;
    color: #ffffff;
    border-radius: 24px;
    padding: 16px;
    font-weight: 700;
    width: 100%;
    border: none;
    font-size: 16px;
    transition: 0.2s;
    margin-top: 10px;
}

.btn-custom:hover {
    background: #222222;
    transform: translateY(-2px);
}

.page-note {
    text-align: center;
    font-weight: 500;
    color: #6b7280;
    font-size: 14px;
    margin-top: 25px;
}

.aux-link {
    color: #4A3AFF;
    font-weight: 700;
    text-decoration: none;
}

.aux-link:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

    <!-- BRAND HEADER (Centered above the card) -->
    <div class="brand-container">
        <!-- Using Bootstrap Icon for Rocket with Gradient -->
        <i class="bi bi-rocket-takeoff-fill brand-icon"></i>
        <h1 class="brand-title">EchoMateLite</h1>
        <p class="brand-subtitle">Connect • Share • Explore</p>
    </div>

    <!-- WHITE AUTH CARD -->
    <div class="auth-card">
        <h2 class="auth-header">Welcome Back</h2>
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-custom">Login</button>
        </form>
        
        <div class="page-note">
            New here? 
            <a href="/register" class="aux-link">Create an account</a>
        </div>
    </div>

</body>
</html>
