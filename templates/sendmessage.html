<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Send Message • EchoMateLite</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
min-height:100vh;
padding-bottom:100px;
}

.page{
max-width:750px;
margin:45px auto;
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo a{
text-decoration:none;
color:white;
}

.logo h1{
font-weight:800;
margin:0;
font-size:2.5rem;
}

.logo p{
color:#dbeafe;
margin-top:8px;
}

.message-card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border-radius:24px;
padding:35px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.message-card h3{
color:white;
margin-bottom:25px;
font-weight:700;
}

.form-control{
border-radius:20px;
border:none;
padding:18px;
resize:none;
}

.form-control:focus{
box-shadow:none;
border:2px solid #60a5fa;
}

.btn-send,
.btn-cancel{
border-radius:50px;
padding:12px 30px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="page">

<div class="logo">

<a href="/dashboard">

<h1>🚀 EchoMateLite</h1>

</a>

<p>Send a message instantly</p>

</div>

<div class="message-card">

<h3>

💬 Send Message

</h3>

<form method="POST">

<div class="mb-4">

<textarea
name="message"
rows="6"
class="form-control"
placeholder="Type your message..."
required></textarea>

</div>

<div class="d-flex gap-3">

<button
type="submit"
class="btn btn-primary btn-send">

📨 Send

</button>

<a
href="/dashboard"
class="btn btn-light btn-cancel">

← Cancel

</a>

</div>

</form>

</div>

</div>

{% include "navbar.html" %}

</body>
</html>
