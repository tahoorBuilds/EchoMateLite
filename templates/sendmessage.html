<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Message • EchoMateLite</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
body {
    margin: 0;
    padding: 0;
    background: #000000;
    color: #ffffff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding-bottom: 120px;
}

.page-container {
    width: min(100%, 550px);
    margin: 20px auto 24px;
    padding: 0 16px;
}

.page-header {
    text-align: center;
    margin-bottom: 24px;
}

.page-header h2 {
    font-weight: 800;
    background: linear-gradient(90deg, #4A3AFF 0%, #FF6B4A 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
    font-size: 28px;
}

.ui-card {
    background: #ffffff;
    border-radius: 36px;
    padding: 30px 24px;
    color: #000000;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.form-control {
    background: #F4F4F5;
    border: none;
    border-radius: 20px;
    padding: 16px;
    font-size: 14px;
    color: #000;
    resize: none;
    font-weight: 500;
}

.form-control:focus {
    box-shadow: none;
    background: #eef0f2;
}

.btn-dark-custom {
    background: #000;
    color: #fff;
    border-radius: 24px;
    padding: 14px 24px;
    font-weight: 700;
    border: none;
    width: 100%;
}

.btn-outline-custom {
    border: 1px solid #ddd;
    color: #000;
    border-radius: 24px;
    padding: 14px 24px;
    font-weight: 700;
    background: transparent;
    text-decoration: none;
    display: block;
    text-align: center;
    width: 100%;
}
</style>
</head>

<body>
{% include "navbar.html" %}

<div class="page-container">
    <div class="page-header">
        <h2>Send Message</h2>
        <p class="text-white-50 mt-1">Start a conversation</p>
    </div>

    <div class="ui-card">
        <h5 class="fw-bold mb-4">💬 Write your message</h5>
        <form method="POST">
            <div class="mb-4">
                <textarea
                name="message"
                rows="5"
                class="form-control"
                placeholder="Type your message here..."
                required></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn-dark-custom">📨 Send</button>
                <a href="/inbox" class="btn-outline-custom">← Cancel</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
