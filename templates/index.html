<!DOCTYPE html>
<html>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container-hero">
  <div class="hero-card">

      <div class="brand-mark">E</div>

        <p class="brand-subtitle">A crisp social space to share stories, connect with friends, and explore what matters.</p>

    </div>

    <div class="cta-group">
      <a href="/login" class="btn btn-primary">Login</a>
      <a href="/register" class="btn btn-secondary">Register</a>

    <ul class="feature-list">
      <li class="feature-item"><span>1</span> Smooth feed with likes, comments, and conversations.</li>
      <li class="feature-item"><span>2</span> Profile stories, posts, and instant connections.</li>
