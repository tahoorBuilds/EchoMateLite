<!DOCTYPE html>
<html>
<head>
    <title>Viewing Story</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #000; color: white; margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .story-header { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .story-user { display: flex; align-items: center; gap: 10px; }
        .story-user img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .story-media { max-width: 100%; max-height: 90vh; border-radius: 15px; }
        .close-btn { color: white; font-size: 25px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="story-header">
        <div class="story-user">
            <!-- Profile Pic & Username -->
            <img src="/static/profile_pics/{{ story_user[2] }}" onerror="this.src='https://ui-avatars.com/api/?name={{ story_user[1] }}'">
            <strong style="text-shadow: 1px 1px 3px black;">{{ story_user[1] }}</strong>
        </div>
        
        <!-- Action Buttons -->
        <div style="display: flex; gap: 15px; align-items: center;">
            <!-- Agar current user story owner hai, toh delete button dikhao -->
            {% if story_user[0] == current_user_id %}
            <a href="/delete_story/{{ stories[0][0] }}" class="close-btn text-danger" onclick="return confirm('Delete this story?');"><i class="bi bi-trash3-fill"></i></a>
            {% endif %}
            
            <a href="/feed" class="close-btn"><i class="bi bi-x-lg"></i></a>
        </div>
    </div>

    <!-- Media Display (Image or Video) -->
    {% set filename = stories[0][1] | string | lower %}
    {% if filename.endswith('.mp4') or filename.endswith('.mov') or filename.endswith('.webm') %}
        <video src="/static/post_images/{{ stories[0][1] }}" class="story-media" autoplay playsinline controls></video>
    {% else %}
        <img src="/static/post_images/{{ stories[0][1] }}" class="story-media">
    {% endif %}

</body>
</html>
