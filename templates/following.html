<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Following • EchoMateLite</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
min-height:100vh;
padding-bottom:100px;
}

.page{
max-width:700px;
margin:40px auto;
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo a{
text-decoration:none;
color:white;
}

.logo h1{
font-weight:800;
}

.card-user{
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border-radius:20px;
padding:18px 22px;
margin-bottom:18px;
}

.card-user a{
color:white;
text-decoration:none;
font-size:20px;
font-weight:600;
display:block;
}

.card-user:hover{
transform:translateY(-3px);
transition:.25s;
}

</style>

</head>

<body>

<div class="page">

<div class="logo">

<a href="/dashboard">

<h1>🚀 EchoMateLite</h1>

</a>

<h4 class="text-white">Following</h4>

</div>

{% for user in following %}

<div class="card-user">

<a href="/user/{{ user[0] }}">

👤 {{ user[1] }}

</a>

</div>

{% else %}

<div class="alert alert-light">

Not following anyone yet.

</div>

{% endfor %}

</div>

{% include "navbar.html" %}

</body>
</html>
