<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Posts • EchoMateLite</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    background:
        radial-gradient(circle at top left,rgba(59,130,246,.15),transparent 28%),
        radial-gradient(circle at bottom right,rgba(6,182,212,.18),transparent 28%),
        linear-gradient(135deg,#eef5ff 0%,#f8fbff 100%);
    padding-bottom:100px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:35px 18px;
}

.post-card{
    background:#fff;
    border:none;
    border-radius:24px;
    padding:22px;
    margin-bottom:30px;
    box-shadow:0 12px 30px rgba(0,0,0,.08);
    transition:.25s;
    overflow:hidden;
}

.post-card:hover{
    transform:translateY(-4px);
    box-shadow:0 18px 40px rgba(37,99,235,.15);
}

.post-card img{
    width:100%;
    border-radius:18px;
    margin-top:15px;
    display:block;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    padding-bottom:15px;
    border-bottom:1px solid #e5e7eb;
}

.header h1,
.header h2,
.header h3{
    margin:0;
    color:#1e3a8a;
    font-weight:700;
}

.btn{
    border-radius:14px;
    font-weight:600;
}

@media(max-width:768px){

.container{
    padding:20px 12px;
}

.post-card{
    padding:18px;
    border-radius:20px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h2>📝 My Posts</h2>

<a href="/profile" class="btn btn-secondary">
← Back
</a>

</div>

{% if posts %}

{% for post in posts %}

<div class="post-card" id="post-{{ post[0] }}">

<p class="fs-5">

{{ post[1] }}

</p>

{% if post[2] %}

<img
src="{{ url_for('static', filename='post_images/' + post[2]) }}">

{% endif %}

<div class="mt-3 d-flex gap-2">

<a
href="/editpost/{{ post[0] }}"
class="btn btn-warning">

✏ Edit

</a>

<a
href="/deletepost/{{ post[0] }}"
class="delete-post btn btn-danger">

🗑 Delete

</a>

</div>

</div>

{% endfor %}

{% else %}

<div class="alert alert-info text-center">

No posts yet.

</div>

{% endif %}

</div>

<script>

document.addEventListener("click", async function(e){

const btn=e.target.closest(".delete-post");

if(!btn) return;

e.preventDefault();

const res=await fetch(btn.href);

const data=await res.json();

if(data.success){

document.getElementById("post-"+data.post_id).remove();

}

});

</script>

</body>
</html>
