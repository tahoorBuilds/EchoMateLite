<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard • EchoMateLite</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body{
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
            min-height:100vh;
            padding-bottom:100px;
        }

        .top-brand{
            padding:30px 0;
            text-align:center;
        }

        .top-brand a{
            text-decoration:none;
            color:#fff;
        }

        .top-brand h1{
            font-weight:800;
            margin:0;
            font-size:2.5rem;
        }

        .top-brand p{
            color:#cbd5e1;
        }

        .glass-card{
            background:rgba(255,255,255,.12);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.15);
            border-radius:22px;
            color:#fff;
            transition:.25s;
        }

        .glass-card:hover{
            transform:translateY(-5px);
        }

        .glass-card h2{
            font-size:2.2rem;
            font-weight:bold;
        }

        .dashboard-btn{
            border-radius:50px;
            padding:14px;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="container">

<div class="top-brand">

<a href="/dashboard">

<h1>🚀 EchoMateLite</h1>

</a>

<p>Admin Control Panel</p>

</div>

<div class="row g-4">

<div class="col-md-6">

<div class="glass-card p-4 text-center">

<h5>Total Users</h5>

<h2>{{ total_users }}</h2>

</div>

</div>

<div class="col-md-6">

<div class="glass-card p-4 text-center">

<h5>Total Posts</h5>

<h2>{{ total_posts }}</h2>

</div>

</div>

<div class="col-md-6">

<div class="glass-card p-4 text-center">

<h5>Total Likes</h5>

<h2>{{ total_likes }}</h2>

</div>

</div>

<div class="col-md-6">

<div class="glass-card p-4 text-center">

<h5>Total Comments</h5>

<h2>{{ total_comments }}</h2>

</div>

</div>

</div>

<div class="text-center mt-5">

<a href="/dashboard" class="btn btn-light dashboard-btn px-5">

🏠 Back to Dashboard

</a>

</div>

</div>

{% include "navbar.html" %}

</body>
</html>
