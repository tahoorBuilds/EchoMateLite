```html
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EchoMateLite</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
    margin:0;
    padding-bottom:80px;
}

.header{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:30px 20px;
    border-radius:0 0 25px 25px;
    text-align:center;
}

.profile-pic{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid white;
}

.stat-card{
    border:none;
    border-radius:15px;
    text-align:center;
}

.action-btn{
    border-radius:15px;
    padding:14px;
    font-weight:600;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    border-top:1px solid #ddd;
    padding:10px 0;
}
</style>
</head>

<body>

<div class="header">

{% if user[1] %}
<img src="{{ url_for('static', filename='profile_pics/' + user[1]) }}"
class="profile-pic">
{% endif %}

<h3 class="mt-3">{{ user[0] }}</h3>

</div>

<div class="container mt-4">

<div class="row g-3">

<div class="col-4">
<div class="card stat-card bg-primary text-white p-3">
<h6>Posts</h6>
<h4>{{ total_posts }}</h4>
</div>
</div>

<div class="col-4">
<div class="card stat-card bg-success text-white p-3">
<h6>Followers</h6>
<h4>{{ followers_count }}</h4>
</div>
</div>

<div class="col-4">
<div class="card stat-card bg-warning p-3">
<h6>Following</h6>
<h4>{{ following_count }}</h4>
</div>
</div>

</div>

<div class="row g-3 mt-3">

<div class="col-6">
<a href="/createpost" class="btn btn-primary w-100 action-btn">
➕ Create Post
</a>
</div>

<div class="col-6">
<a href="/feed" class="btn btn-success w-100 action-btn">
📰 Feed
</a>
</div>

<div class="col-6">
<a href="/profile" class="btn btn-info w-100 action-btn">
👤 Profile
</a>
</div>

<div class="col-6">
<a href="/inbox" class="btn btn-secondary w-100 action-btn">
💬 Inbox
</a>
</div>

<div class="col-6">
<a href="/notifications" class="btn btn-danger w-100 action-btn">
🔔 Notifications
</a>
</div>

<div class="col-6">
<a href="/logout" class="btn btn-dark w-100 action-btn">
🚪 Logout
</a>
</div>

</div>

</div>

<div class="bottom-nav">
<div class="container">
<div class="row text-center">
<div class="col"><a href="/dashboard">🏠</a></div>
<div class="col"><a href="/feed">📰</a></div>
<div class="col"><a href="/createpost">➕</a></div>
<div class="col"><a href="/inbox">💬</a></div>
<div class="col"><a href="/profile">👤</a></div>
</div>
</div>
</div>

</body>
</html>
```
