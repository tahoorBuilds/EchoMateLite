<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard • EchoMateLite</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
    margin:0;
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 15% 20%, rgba(59,130,246,.22), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(6,182,212,.18), transparent 30%),
        linear-gradient(135deg,#dbeafe 0%,#c7d2fe 45%,#93c5fd 100%);
}
body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(110px);
    z-index:-1;
}

body::before{
    width:380px;
    height:380px;
    background:rgba(37,99,235,.18);
    top:-120px;
    left:-120px;
}

body::after{
    width:420px;
    height:420px;
    background:rgba(34,211,238,.15);
    bottom:-150px;
    right:-150px;
}

.dashboard-card{
    max-width:900px;
    width:92%;
    margin:25px auto;
    padding:30px 20px;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(18px);
    border-radius:30px;
    border:1px solid rgba(255,255,255,.4);
   box-shadow:0 20px 60px rgba(30,64,175,.15);
}

@media(max-width:768px){

.dashboard-card{
    width:94%;
    margin:20px auto;
    padding:24px 18px;
}

}

.profile-pic{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #2563eb;
    box-shadow:0 12px 30px rgba(37,99,235,.25);
}

.action-btn{
    border-radius:20px;
    padding:20px;
    font-weight:700;
    transition:.2s;
}

.action-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 35px rgba(37,99,235,.20);
}

@media(max-width:768px){

.dashboard-card{
    margin:20px;
    padding:25px;
}

.profile-pic{
    width:90px;
    height:90px;
}

}

</style>

</head>

<body>

<div class="dashboard-card">

<div class="text-center mb-3">

<a href="/dashboard">

<div class="brand-header justify-content-center">

    <div class="brand-mark">🚀</div>

    <div>

        <h1 class="brand-title">EchoMateLite</h1>

        <p class="brand-subtitle">
            Connect • Share • Explore
        </p>

    </div>

</div>

</a>

{% if user[1] %}

<img
src="{{ url_for('static', filename='profile_pics/' + user[1]) }}"
class="profile-pic">

{% endif %}

</div>

<div class="row mt-2 g-3">

<div class="col-md-4">

<a href="/createpost" class="btn btn-primary w-100 action-btn">

➕ Create Post

</a>

</div>

<div class="col-md-4">

<a href="/feed" class="btn btn-success w-100 action-btn">

📰 Feed

</a>

</div>

<div class="col-md-4">

<a href="/profile" class="btn btn-info w-100 action-btn">

👤 Profile

</a>

</div>

<div class="col-md-4">

<a href="/inbox" class="btn btn-secondary w-100 action-btn">

💬 Inbox

</a>

</div>

<div class="col-md-4">

<a href="/notifications" class="btn btn-danger w-100 action-btn">

🔔 Notifications

</a>

</div>

<div class="col-md-4">

<a href="/logout" class="btn btn-dark w-100 action-btn">

🚪 Logout

</a>

</div>

</div>

</div>

{% include "navbar.html" %}

</body>
</html>
