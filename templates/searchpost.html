<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search Posts • EchoMateLite</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
min-height:100vh;
padding-bottom:100px;
}

.page{
max-width:850px;
margin:40px auto;
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo a{
text-decoration:none;
color:white;
}

.logo h1{
font-weight:800;
}

.search-box{
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
padding:25px;
border-radius:22px;
margin-bottom:30px;
}

.search-box input{
border-radius:50px;
padding:14px;
}

.post-card{
background:white;
border-radius:20px;
padding:22px;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.post-card h5{
font-weight:700;
color:#2563eb;
}

.post-card p{
margin-top:12px;
font-size:16px;
}

</style>

</head>

<body>

<div class="page">

<div class="logo">

<a href="/dashboard">

<h1>🚀 EchoMateLite</h1>

</a>

<h4 class="text-white">

Search Posts

</h4>

</div>

<div class="search-box">

<form method="POST">

<div class="input-group">

<input
type="text"
name="keyword"
class="form-control"
placeholder="Search posts..."
required>

<button
class="btn btn-primary rounded-pill px-4">

🔍 Search

</button>

</div>

</form>

</div>

{% if posts %}

{% for post in posts %}

<div class="post-card">

<h5>

👤 {{ post[2] }}

</h5>

<p>

{{ post[1] }}

</p>

<a
href="/user/{{ post[3] }}"
class="btn btn-primary rounded-pill">

View Profile

</a>

</div>

{% endfor %}

{% else %}

<div class="alert alert-light">

No posts found.

</div>

{% endif %}

</div>

{% include "navbar.html" %}

</body>
</html>
