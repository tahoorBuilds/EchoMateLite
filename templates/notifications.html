<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications • EchoMateLite</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
    margin:0;
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    background:
        radial-gradient(circle at top left,rgba(59,130,246,.15),transparent 28%),
        radial-gradient(circle at bottom right,rgba(6,182,212,.18),transparent 28%),
        linear-gradient(135deg,#eef5ff 0%,#f8fbff 100%);
    padding-bottom:100px;
}

.page{
    max-width:800px;
    margin:35px auto;
    padding:35px;
    background:rgba(255,255,255,.95);
    border-radius:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:35px;
}

.logo a{
    text-decoration:none;
    color:#1e3a8a;
}

.logo h1{
    font-weight:800;
    color:#1e3a8a;
    margin-bottom:8px;
}

.logo h4{
    color:#64748b;
    font-weight:600;
}

.notify{
    background:#ffffff;
    border-radius:22px;
    padding:20px;
    margin-bottom:18px;
    border:1px solid #e5e7eb;
    box-shadow:0 10px 25px rgba(0,0,0,.06);
    transition:.25s;
}

.notify:hover{
    transform:translateY(-3px);
    box-shadow:0 18px 35px rgba(37,99,235,.12);
}

.notify h5{
    color:#1e3a8a;
    font-weight:700;
    margin-bottom:8px;
}

.notify small{
    color:#6b7280;
}

.btn{
    border-radius:50px;
    padding:12px 32px;
    font-weight:600;
}

@media(max-width:768px){

.page{
    margin:20px 12px;
    padding:24px;
    border-radius:24px;
}

}

</style>

</head>

<body>

<div class="page">

<div class="logo">

<a href="/dashboard">

<h1>🚀 EchoMateLite</h1>

</a>

<h4 class="text-white">

Notifications

</h4>

</div>

{% for n in notifications %}

<a href="{{ n[1] if n[1] else url_for('notifications') }}" class="text-decoration-none text-dark">
  <div class="notify">

  <h5>{{ n[0] }}</h5>

  <small>{{ n[2] }}</small>

  </div>
</a>

{% else %}

<div class="alert alert-light">

No notifications.

</div>

{% endfor %}

<div class="text-center mt-4">

</div>

</div>

{% include "navbar.html" %}

</body>
</html>
