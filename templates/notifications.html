<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications • EchoMateLite</title>

<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
body {
    margin: 0;
    padding: 0;
    background: #000000;
    color: #ffffff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding-bottom: 120px;
}

.page-container {
    width: min(100%, 550px);
    margin: 10px auto 24px;
    padding: 0 16px;
}

.page-header {
    text-align: center;
    margin-bottom: 24px;
}

.page-header h2 {
    font-weight: 800;
    background: linear-gradient(90deg, #4A3AFF 0%, #FF6B4A 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
    font-size: 28px;
}

.ui-card {
    background: #ffffff;
    border-radius: 36px;
    padding: 30px 20px;
    color: #000000;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}

.notify-item {
    background: #F4F4F5;
    border-radius: 20px;
    padding: 16px 20px;
    margin-bottom: 14px;
    transition: 0.2s;
    display: block;
    text-decoration: none;
    color: #111827;
    border: 1px solid transparent;
}

.notify-item:hover {
    background: #eef0f2;
    border-color: #ddd;
}

.notify-item h5 {
    color: #111827;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 6px;
}

.notify-item small {
    color: #6b7280;
    font-size: 12px;
    font-weight: 500;
}

/* --- BOTTOM NAV --- */
.bottom-nav-container {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    width: min(85%, 320px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 24px;
    background: #1C1C1E;
    border-radius: 40px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.6);
    z-index: 9999;
}
.nav-item {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    color: #8E8E93;
    text-decoration: none;
    transition: 0.3s;
}
.nav-item.active { background: #ffffff; color: #000000; }
.nav-icon { font-size: 20px; }
</style>
</head>

<body>
{% include "navbar.html" %}

<div class="page-container">
    <div class="page-header">
        <a href="/feed" class="text-decoration-none">
            <h2>EchoMateLite</h2>
        </a>
        <p class="text-white-50 mt-1">Activity & Alerts</p>
    </div>

    <div class="ui-card">
        <h5 class="fw-bold mb-4 px-2">🔔 Notifications</h5>

        {% for n in notifications %}
        <a href="{{ n[1] if n[1] else url_for('notifications') }}" class="notify-item">
            <h5>{{ n[0] }}</h5>
            <small>{{ n[2] }}</small>
        </a>
        {% else %}
        <div class="text-center text-muted py-5">
            <i class="bi bi-bell-slash" style="font-size: 40px; color: #ccc;"></i>
            <h6 class="mt-3 fw-bold">No notifications yet</h6>
            <p class="small mb-0">We'll let you know when something happens.</p>
        </div>
        {% endfor %}
    </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav-container">
    <a href="/feed" class="nav-item">
        <i class="bi bi-house-door-fill nav-icon"></i>
    </a>
    <a href="/searchuser" class="nav-item">
        <i class="bi bi-search nav-icon"></i>
    </a>
    <a href="/createpost" class="nav-item">
        <i class="bi bi-plus-square nav-icon"></i>
    </a>
    <a href="/profile" class="nav-item">
        <i class="bi bi-person-fill nav-icon"></i>
    </a>
</div>

</body>
</html>
