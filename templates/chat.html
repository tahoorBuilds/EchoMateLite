<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat • EchoMateLite</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    min-height:100vh;
    padding-bottom:100px;
}

.brand{
    text-align:center;
    padding:25px 0;
}

.brand a{
    color:#fff;
    text-decoration:none;
}

.brand h2{
    font-weight:800;
}

.chat-card{
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(16px);
    border-radius:20px;
    border:1px solid rgba(255,255,255,.15);
    overflow:hidden;
}

.chat-header{
    color:#fff;
    padding:20px;
    font-size:22px;
    font-weight:bold;
}

.chat-body{
    height:500px;
    overflow-y:auto;
    padding:20px;
}

.message{
    background:white;
    border-radius:15px;
    padding:12px;
    margin-bottom:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.message strong{
    color:#2563eb;
}

.message small{
    color:#6b7280;
}

.chat-footer{
    padding:20px;
}

.form-control{
    border-radius:50px;
}

.btn-send{
    border-radius:50px;
    padding:10px 24px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="brand">

<a href="/dashboard">

<h2>🚀 EchoMateLite</h2>

</a>

</div>

<div class="chat-card">

<div class="chat-header">

💬 Chat

</div>

<div class="chat-body">

{% if messages %}

{% for message in messages %}

<div class="message">

<strong>{{ message[2] }}</strong>

<p class="mt-2 mb-2">
{{ message[1] }}
</p>

<small>{{ message[4] }}</small>

{% if message[3]==session["user_id"] %}

<div class="mt-2">

<a
href="/deletemessage/{{ message[0] }}/{{ user_id }}"
class="btn btn-sm btn-danger"
onclick="return confirm('Delete message?')">

🗑 Delete

</a>

</div>

{% endif %}

</div>

{% endfor %}

{% else %}

<div class="alert alert-light">

No messages yet.

</div>

{% endif %}

</div>

<div class="chat-footer">

<form
action="/sendmessage/{{ user_id }}"
method="POST">

<div class="input-group">

<input
type="text"
name="message"
class="form-control"
placeholder="Type message..."
required>

<button
class="btn btn-primary btn-send">

Send

</button>

</div>

</form>

</div>

</div>

<div class="text-center mt-4">

<a
href="/inbox"
class="btn btn-light rounded-pill px-4">

← Back

</a>

</div>

</div>

{% include "navbar.html" %}

</body>
</html>
