<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Likes • EchoMateLite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
/* INSTAGRAM CLEAN LIGHT BACKGROUND */
body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background-color: #fafafa; /* Pure Instagram light background */
    color: #262626;
    padding-bottom: 100px;
}

.page {
    max-width: 500px; /* Sleek application layout view */
    margin: 40px auto;
    padding: 0 15px;
}

.logo {
    text-align: center;
    margin-bottom: 35px;
}

.logo a {
    color: #262626;
    text-decoration: none;
}

.logo h1 {
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.5px;
}

.logo h4 {
    font-size: 16px;
    font-weight: 600;
    margin-top: 10px;
}

/* INSTAGRAM STYLE USER LIST CARD */
.user-card {
    background: #ffffff;
    border: 1px solid #dbdbdb;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 12px;
    color: #262626; /* Dark text for perfect visibility */
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.01);
}

/* NO LIKES YET ALERT BOX */
.alert-custom {
    background: #ffffff;
    border: 1px solid #dbdbdb;
    color: #737373;
    border-radius: 12px;
    text-align: center;
    padding: 20px;
}

/* SHARP MINIMAL BACK BUTTON */
.btn-back-insta {
    border: 1px solid #dbdbdb !important;
    background: #ffffff !important;
    color: #262626 !important;
    font-weight: 600;
    font-size: 14px;
    border-radius: 8px !important;
    transition: background 0.2s ease;
}
.btn-back-insta:hover {
    background: #f2f2f2 !important;
}
</style>
</head>

<body>

<div class="page">

    <div class="logo">
        <a href="/dashboard">
            <h1>🚀 EchoMateLite</h1>
        </a>
        <h4 style="color: #ed4956 !important;">
            ❤️ Users Who Liked This Post
        </h4>
    </div>

    {% if users %}
        {% for user in users %}
            <div class="user-card">
                <span style="font-size: 18px;">👤</span> {{ user[0] }}
            </div>
        {% endfor %}
    {% else %}
        <div class="alert-custom">
            No likes yet.
        </div>
    {% endif %}

    <div class="text-center mt-4">
        <a href="/feed" class="btn btn-back-insta px-5 py-2">
            ← Back to Feed
        </a>
    </div>

</div>

{% include "navbar.html" %}

</body>
</html>
