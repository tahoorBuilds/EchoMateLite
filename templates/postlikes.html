<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Post Likes • EchoMateLite</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
min-height:100vh;
padding-bottom:100px;
}

.page{
max-width:700px;
margin:40px auto;
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo a{
color:white;
text-decoration:none;
}

.logo h1{
font-weight:800;
}

.user-card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
border-radius:18px;
padding:18px;
margin-bottom:16px;
color:white;
font-size:18px;
}

</style>

</head>

<body>

<div class="page">

<div class="logo">

<a href="/dashboard">

<h1>🚀 EchoMateLite</h1>

</a>

<h4 class="text-white">

❤️ Users Who Liked This Post

</h4>

</div>

{% if users %}

{% for user in users %}

<div class="user-card">

👤 {{ user[0] }}

</div>

{% endfor %}

{% else %}

<div class="alert alert-light">

No likes yet.

</div>

{% endif %}

<div class="text-center mt-4">

<a href="/feed" class="btn btn-light rounded-pill px-5">

← Back to Feed

</a>

</div>

</div>

{% include "navbar.html" %}

</body>
</html>
