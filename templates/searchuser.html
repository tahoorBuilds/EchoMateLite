<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search Users • EchoMateLite</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

body{
    margin:0;
    min-height:100vh;
    font-family:'Poppins',sans-serif;
    background:
        radial-gradient(circle at top left,rgba(59,130,246,.15),transparent 28%),
        radial-gradient(circle at bottom right,rgba(6,182,212,.18),transparent 28%),
        linear-gradient(135deg,#eef5ff 0%,#f8fbff 100%);
    padding-bottom:100px;
}

.page{
    max-width:700px;
    margin:40px auto;
    padding:0 15px;
}

.logo{
    text-align:center;
    margin-bottom:35px;
}

.logo a{
    text-decoration:none;
    color:#1e3a8a;
}

.logo h1{
    font-weight:800;
    margin:0;
    font-size:2.5rem;
    color:#1e3a8a;
}

.logo p{
    color:#64748b;
    margin-top:8px;
}

.search-card{
    background:#ffffff;
    border-radius:30px;
    padding:35px;
    border:1px solid #e5e7eb;
    box-shadow:0 20px 50px rgba(0,0,0,.08);
}

.form-control{
    border-radius:18px;
    padding:15px 18px;
    border:1px solid #dbeafe;
    box-shadow:none;
}

.form-control:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 .2rem rgba(37,99,235,.15);
}

.btn-search{
    width:100%;
    border:none;
    border-radius:50px;
    padding:15px;
    font-weight:700;
    font-size:17px;
    color:white;
    background:linear-gradient(135deg,#2563eb,#38bdf8);
    transition:.25s;
}

.btn-search:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(37,99,235,.25);
}

@media(max-width:768px){

.page{
    margin:20px auto;
}

.search-card{
    padding:24px;
    border-radius:24px;
}

}

</style>

</head>

<body>

<div class="page">

<div class="logo">

<h1>🚀 EchoMateLite</h1>

</a>

<p>Find friends and explore profiles</p>

</div>

<div class="search-card">

<h3 class="text-white mb-4">

🔍 Search User

</h3>

<form method="POST">

<div class="input-group">

<input
type="text"
name="username"
class="form-control"
placeholder="Enter username..."
required>

<button
type="submit"
class="btn btn-primary btn-search px-4">

Search

</button>

</div>

</form>

</div>

</div>

{% include "navbar.html" %}

</body>
</html>
